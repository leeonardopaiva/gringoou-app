name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          DIRECT_URL: postgresql://user:pass@localhost:5432/ci
      - run: npx prisma generate
      - name: Typecheck (rotas tipadas + tsc)
        run: |
          npx next typegen
          npm run typecheck
      - name: Audit (falha em vulnerabilidade crítica de produção)
        run: npm audit --omit=dev --audit-level=critical
